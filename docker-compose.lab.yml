# Hostinger VPS deployment of the lab API behind a Cloudflare Tunnel (no inbound ports).
# Usage: TUNNEL_TOKEN=… TURNSTILE_SECRET=… docker compose -f docker-compose.lab.yml up -d
services:
  lab-api:
    image: ghcr.io/saulpatinojr/azure-migration-orchestrator-lab:latest
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.lab }
    environment:
      AMO_ASSESSMENT_TTL_MINUTES: "120"
      AMO_ALLOWED_ORIGINS: "${AMO_ALLOWED_ORIGINS:-https://hybridcloudworks.com,https://www.hybridcloudworks.com}"
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:?set TURNSTILE_SECRET in the host environment}"
      AMO_PUBLIC_BASE_URL: "${AMO_PUBLIC_BASE_URL:-https://labs-api.hybridcloudworks.com}"
      # Guided lab (optional): set all three to enable "Open in Coder"; the session token belongs to a template-user, not an admin.
      CODER_URL: "${CODER_URL:-}"
      CODER_SESSION_TOKEN: "${CODER_SESSION_TOKEN:-}"
      CODER_TEMPLATE_ID: "${CODER_TEMPLATE_ID:-}"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
    restart: unless-stopped
    networks: [web]
  cloudflared:
    # Cloudflare Tunnel: TLS terminates at the edge; the VPS opens no inbound ports (ADR-0019).
    image: cloudflare/cloudflared:2025.2.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment: { TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in the host environment}" }
    restart: unless-stopped
    networks: [web]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
networks: { web: {} }
