# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Coder guided-lab workspace image (ADR-0023). Manual only: Coder integration is disabled for the initial deployment
# (WORKING-PLAN.md Phase 1/3), and this Ubuntu-based tooling image must not block the lab API release.
# Build locally -> scan -> push; a failing scan publishes nothing.
name: publish-workspace-image
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver tag for the image (e.g. 0.1.0)"
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/azure-migration-orchestrator-lab-workspace
jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build (local only, for scanning)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: infrastructure/coder/image/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
      - name: Scan before publishing (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ env.IMAGE }}:scan", exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true }
      - id: build
        name: Push with provenance and SBOM
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: infrastructure/coder/image/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }},${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
