# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Downstream flow (ADR-0028, ADR-0030): the upstream product (saulpatinojr/HCW-AzMigrateOrchestrator_App) attaches the two
# package tarballs to the GitHub Release of every v* tag. package.json pins them by URL
#   https://github.com/saulpatinojr/HCW-AzMigrateOrchestrator_App/releases/download/<tag>/hybridcloudworks-migration-core-<version>.tgz
#   https://github.com/saulpatinojr/HCW-AzMigrateOrchestrator_App/releases/download/<tag>/hybridcloudworks-migration-ui-<version>.tgz
# and package-lock.json carries their integrity hash, which `npm ci` verifies. When a newer release exists, this workflow
# bumps both URLs, re-locks, tests this edition against it (unit tests and the browser e2e suite) and opens a pull request
# labelled compatible or needs-adaptation. A compatible PR auto-merges only if the repository variable CORE_AUTOMERGE is "true".
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows, so the compatibility check runs here, not on the PR.
# The same release-asset method serves the Cloud Assessor and NetworkEyes pairs (a release wheel pinned by URL and sha256).
name: core-update
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream release tag to adopt (default: latest release)"
        required: false
permissions:
  contents: write
  pull-requests: write
env:
  UPSTREAM: saulpatinojr/HCW-AzMigrateOrchestrator_App
jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: refs
        name: Compare the pinned release tag with the latest upstream release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REQUESTED: "${{ inputs.ref }}" }
        run: |
          set -euo pipefail
          current="$(grep -oE "releases/download/v[0-9][0-9A-Za-z.+-]*/hybridcloudworks-migration-core-" package.json | head -1 | sed -E 's|releases/download/||; s|/hybridcloudworks-migration-core-||')"
          test -n "$current" || { echo "::error::package.json does not pin the upstream release tarballs"; exit 1; }
          latest="${REQUESTED:-$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)}"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"; echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "already at $current"; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "$current -> $latest"; fi
      - if: steps.refs.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - if: steps.refs.outputs.changed == 'true'
        name: Bump both tarball URLs and re-lock (the lock records each tarball's integrity hash)
        env: { LATEST: "${{ steps.refs.outputs.latest }}", CURRENT: "${{ steps.refs.outputs.current }}" }
        run: |
          set -euo pipefail
          cur_ver="${CURRENT#v}"; new_ver="${LATEST#v}"
          sed -i "s|releases/download/${CURRENT}/hybridcloudworks-migration-core-${cur_ver}.tgz|releases/download/${LATEST}/hybridcloudworks-migration-core-${new_ver}.tgz|; s|releases/download/${CURRENT}/hybridcloudworks-migration-ui-${cur_ver}.tgz|releases/download/${LATEST}/hybridcloudworks-migration-ui-${new_ver}.tgz|" package.json
          grep -q "releases/download/${LATEST}/hybridcloudworks-migration-core-${new_ver}.tgz" package.json
          grep -q "releases/download/${LATEST}/hybridcloudworks-migration-ui-${new_ver}.tgz" package.json
          npm install --package-lock-only --no-audit --no-fund
          git --no-pager diff --stat
      - if: steps.refs.outputs.changed == 'true'
        id: compat
        name: Compatibility check — install, unit tests, browser e2e
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npx playwright install --with-deps chromium
          CI=1 npx playwright test
      - if: steps.refs.outputs.changed == 'true'
        id: pr
        name: Open the bump pull request (ready for review)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: core-update/${{ steps.refs.outputs.latest }}
          title: "core: adopt upstream ${{ steps.refs.outputs.latest }} (${{ steps.compat.outcome == 'success' && 'compatible' || 'needs adaptation' }})"
          commit-message: "core: adopt the upstream release tarballs ${{ steps.refs.outputs.current }} -> ${{ steps.refs.outputs.latest }}"
          labels: core-update,${{ steps.compat.outcome == 'success' && 'compatible' || 'needs-adaptation' }}
          add-paths: |
            package.json
            package-lock.json
          body: |
            Upstream `saulpatinojr/HCW-AzMigrateOrchestrator_App` released **${{ steps.refs.outputs.latest }}** (this edition pinned `${{ steps.refs.outputs.current }}`). The two package tarballs attached to that release are pinned by URL; the lock carries their integrity hash.

            Compatibility check in this workflow run (`npm ci` → `npm test` → build → Playwright e2e): **${{ steps.compat.outcome }}**.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - compatible: merge (automatic if the repository variable `CORE_AUTOMERGE` is `true`).
            - needs adaptation: fix this edition on this branch, then merge.

            ADR-0028 (downstream flow), ADR-0030 (release assets replace the sibling checkout).
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome == 'success' && vars.CORE_AUTOMERGE == 'true' && steps.pr.outputs.pull-request-number != ''
        name: Auto-merge the compatible bump
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}"
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome != 'success'
        run: echo "::warning::Upstream ${{ steps.refs.outputs.latest }} is not compatible with this edition; see the pull request."
