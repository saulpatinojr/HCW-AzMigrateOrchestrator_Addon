# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Downstream flow (ADR-0028, ADR-0030): the upstream product (saulpatinojr/HCW-MigrateOrchestrator_App) attaches the two
# package tarballs to the GitHub Release of every v* tag. package.json pins them by URL
#   https://github.com/saulpatinojr/HCW-MigrateOrchestrator_App/releases/download/<tag>/hybridcloudworks-migration-core-<version>.tgz
#   https://github.com/saulpatinojr/HCW-MigrateOrchestrator_App/releases/download/<tag>/hybridcloudworks-migration-ui-<version>.tgz
# and package-lock.json carries their integrity hash, which `npm ci` verifies. When a newer release exists, this workflow
# bumps both URLs, re-locks, tests this edition against it (unit tests and the browser e2e suite) and opens a pull request
# labelled compatible or needs-adaptation. A compatible PR auto-merges only if the repository variable CORE_AUTOMERGE is "true".
# The same release-asset method serves the Cloud Assessor and NetworkEyes pairs (a release wheel pinned by URL and sha256).
#
# Two jobs, so the upstream packages' code never shares a runner with the App's key. `bump` installs the new release
# (npm ci runs the packages' install scripts), runs this edition's tests and the e2e suite against it, with no secret
# and a read-only GITHUB_TOKEN, and hands its result over as an artifact: package.json, package-lock.json and the
# outcome. `pull-request` starts on a fresh runner from a clean checkout and runs none of that code. It regenerates the
# bump itself with main's own scripts/core-update-pin.mjs and a lock-only install by a hash-checked npm:
#   node npm-cli.js install --package-lock-only --ignore-scripts --allow-git=none --allow-remote=root ...
# A lock-only install writes package-lock.json and nothing else: no node_modules, so no package's code is ever loaded.
# --ignore-scripts stops this project's own install scripts (npm runs those even with --package-lock-only);
# --allow-git=none refuses git dependencies (preparing one runs `npm install` inside its clone); --allow-remote=root
# allows tarball URLs only where this repository's package.json names them; --allow-file=none and
# --allow-directory=root refuse local tarballs and folders other than the workspaces. npm reads each tarball to record
# its sha512 integrity, and takes every registry package's integrity from the registry. scripts/core-update-pin.mjs
# check-lock then requires the two release URLs with a sha512 integrity and every other package from the npm registry.
# The job refuses the artifact unless its package.json and package-lock.json are byte-identical to what it produced,
# and refuses any other file; on a refusal it resets the checkout and stops before the token is minted. Nothing from
# the artifact is copied into the checkout, so nothing generated by upstream code reaches the pull request.
# A step in the same job could reach later steps (through $GITHUB_ENV, or by rewriting a downloaded action), which is
# why the split matters. The outcome is untrusted: it picks the label and the title and nothing else. Auto-merge never
# reads it: it is turned on when the repository variable CORE_AUTOMERGE is "true" and this job's own byte-for-byte
# check passed, and GitHub then merges only after the required checks of the "Protect main" ruleset pass on the pull
# request itself (a fresh run on its own head). Those checks are the trusted signal.
#
# Main only. The pull-request job runs this checkout's scripts/core-update-pin.mjs before it mints the App token, so
# the checkout must be main. A manual run started on any other branch (gh workflow run --ref <branch>) is refused by
# the first step of each job with an error naming the branch, and the pull-request job's `if:` skips it as well; both
# checkouts take the exact commit the run was started for (github.sha), so the two jobs read the same main.
# The App token has no `workflows` permission, so a bump pull request can never change a file under .github/workflows.
# Both jobs install the same npm (NPM_VERSION below, checked against its sha256), so both write the same lock. When the
# npm version moves, its hash moves with it (tests/security/core-update-app-token.test.mjs checks they are the same in
# both jobs). The hash is the sha256 of https://registry.npmjs.org/npm/-/npm-11.20.0.tgz, whose registry integrity is
# sha512-dF3EDFwbYN+N5RUip+ZYDe0NeURK5BgqKOcvT1iNtUYhTMTl0FwWhBuXrS7KtXyduqyTMS5aaQaregnHDAxNgw==.
#
# The pull request is opened with a short-lived GitHub App token (actions/create-github-app-token), not with
# GITHUB_TOKEN. A pull request opened with GITHUB_TOKEN starts no workflow, so the required checks of the
# "Protect main" ruleset never ran on it and it could never merge. One opened with the App token does start
# them, so this edition's own CI (ci, security) also runs on the bump pull request; the compatibility check
# in the `bump` job still runs first and picks the compatible / needs-adaptation label (only the label).
# The credential is the HCW Main Admin App (a GitHub App owned by the repository owner, installed on this
# repository). Its client ID is the repository variable HCW_MAIN_ADMIN_CLIENT_ID (not a secret) and its private
# key is the repository secret HCW_MAIN_ADMIN_PRIVATE_KEY. The key lives only as that secret and is never printed.
# To rotate it: generate a new key on the App's settings page (https://github.com/settings/apps), replace the
# secret in every repository that holds the key (the App is installed on the four add-on
# repositories), then delete the old key there. Only the token step of the `pull-request` job is given the key. It
# mints a token for this repository only with Contents and Pull requests write, and the action revokes the token when
# the job ends.
# GITHUB_TOKEN is read-only here.
# A manual run with probe=true mints the token and makes two read-only API calls (the repository, and the list of
# repositories the token covers, which must be this one only) and nothing else that writes,
# to prove the credential on a day when there is no release to adopt:
#   gh workflow run core-update.yml --ref main -f probe=true
name: core-update
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream release tag to adopt (default: latest release)"
        required: false
      probe:
        description: "Only prove the GitHub App credential: mint the token and make read-only calls (default: false)"
        type: boolean
        default: false
permissions: {}
env:
  UPSTREAM: saulpatinojr/HCW-MigrateOrchestrator_App
  NPM_VERSION: 11.20.0
  NPM_SHA256: d1a92f40e6c407b84c3a00c3cf978a10b24fd42f153c527e2016cef7bb34a483
jobs:
  # Job 1 of 2. Installs and runs the new release's code, so it gets no secret at all: GITHUB_TOKEN is read-only and
  # reaches only the refs step, which runs no project code. What it produces leaves as an artifact.
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refs.outputs.changed }}
      latest: ${{ steps.refs.outputs.latest }}
      current: ${{ steps.refs.outputs.current }}
    steps:
      # No job-level `if:` here on purpose: a run on another branch must fail visibly, not be skipped in silence.
      - name: Refuse a run that is not on main
        env: { RUN_REF: "${{ github.ref }}" }
        run: |
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::core-update runs only on main; this run was started on ${RUN_REF}. Start it again with --ref main."
            exit 1
          fi
      # persist-credentials: false: no token is left in the git config for the code below. github.sha: the commit on
      # main that this run was started for, the same one the pull-request job checks out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "${{ github.sha }}" }
      - id: refs
        name: Compare the pinned release tag with the latest upstream release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REQUESTED: "${{ inputs.ref }}" }
        run: |
          set -euo pipefail
          current="$(grep -oE "releases/download/v[0-9][0-9A-Za-z.+-]*/hybridcloudworks-migration-core-" package.json | head -1 | sed -E 's|releases/download/||; s|/hybridcloudworks-migration-core-||')"
          test -n "$current" || { echo "::error::package.json does not pin the upstream release tarballs"; exit 1; }
          latest="${REQUESTED:-$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)}"
          case "$latest" in *$'\n'*|*$'\r'*) echo "::error::the upstream tag is not a single line"; exit 1;; esac
          # The tag reaches GITHUB_OUTPUT, the bump script and a URL, so refuse anything that is not a plain release
          # tag, vMAJOR.MINOR.PATCH, the only form the upstream release workflow publishes: a tag with a line break
          # would add an output line, and one such as `v9|;e…` was a shell command when the bump still used sed.
          # tests/security pin this guard.
          [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected upstream tag: not vMAJOR.MINOR.PATCH"; exit 1; }
          [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the pinned tag in package.json is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"; echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "already at $current"; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "$current -> $latest"; fi
      - if: steps.refs.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, package-manager-cache: false }
      - if: steps.refs.outputs.changed == 'true'
        name: npm, hash-checked (the same npm as the pull-request job)
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/npm-pinned"
          rm -rf "$dir"; mkdir -p "$dir"
          curl -sSfL --proto '=https' -o "$dir/npm.tgz" "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
          printf '%s  %s\n' "$NPM_SHA256" "$dir/npm.tgz" | sha256sum -c --quiet -
          tar -xzf "$dir/npm.tgz" -C "$dir"
          test "$(node "${RUNNER_TEMP}/npm-pinned/package/bin/npm-cli.js" --version)" = "$NPM_VERSION"
      - if: steps.refs.outputs.changed == 'true'
        name: Bump both tarball URLs and re-lock (the lock records each tarball's integrity hash)
        env: { LATEST: "${{ steps.refs.outputs.latest }}", CURRENT: "${{ steps.refs.outputs.current }}" }
        run: |
          set -euo pipefail
          # The same three commands as the pull-request job's apply step, which must produce the same two files.
          node scripts/core-update-pin.mjs bump --from "$CURRENT" --to "$LATEST"
          node "${RUNNER_TEMP}/npm-pinned/package/bin/npm-cli.js" install --package-lock-only --ignore-scripts --allow-git=none --allow-remote=root --allow-file=none --allow-directory=root --no-audit --no-fund --no-update-notifier
          node scripts/core-update-pin.mjs check-lock --tag "$LATEST"
          git --no-pager diff --stat
      # From here on the job runs the upstream packages' code; no step below is given a token.
      - if: steps.refs.outputs.changed == 'true'
        id: compat
        name: Compatibility check — install, unit tests, browser e2e
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npx playwright install --with-deps chromium
          CI=1 npx playwright test
      # Only the two bump files travel, with the outcome of the compatibility step written as one word.
      - if: steps.refs.outputs.changed == 'true'
        name: Collect the bump for the pull-request job
        env: { COMPAT: "${{ steps.compat.outcome }}" }
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/bump"
          rm -rf "$dir"; mkdir -p "$dir/files"
          cp -- package.json package-lock.json "$dir/files/"
          printf '%s\n' "$COMPAT" > "$dir/outcome.txt"
          find "$dir" -type f | sed "s|^${dir}/||"
      - if: steps.refs.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-bump
          path: ${{ runner.temp }}/bump
          if-no-files-found: error
          retention-days: 1

  # Job 2 of 2. A fresh runner with a clean checkout of the same commit. It runs none of the upstream packages' code
  # and none of this repository's code except scripts/core-update-pin.mjs (from this checkout, i.e. main) and the
  # hash-checked npm's lock-only install. It does not trust the artifact: it regenerates the bump itself and refuses the
  # artifact unless its package.json and package-lock.json are byte-identical to what it produced. Nothing from the
  # artifact is copied in; the outcome only picks the label and the title. Auto-merge does not read the outcome: it
  # needs the repository variable CORE_AUTOMERGE and this job's own check, and the merge waits for the required checks
  # on the pull request.
  pull-request:
    needs: bump
    if: github.ref == 'refs/heads/main' && (needs.bump.outputs.changed == 'true' || inputs.probe)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The same refusal as the bump job's first step, so this job holds even if its `if:` is ever loosened.
      - name: Refuse a run that is not on main
        env: { RUN_REF: "${{ github.ref }}" }
        run: |
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::core-update runs only on main; this run was started on ${RUN_REF}. Start it again with --ref main."
            exit 1
          fi
      # persist-credentials: false — create-pull-request sets its own Authorization header for the push; with the
      # checkout's persisted header beside it, git sends two and GitHub answers 400 (seen in the upstream App's rules-refresh).
      # github.sha: the commit on main this run was started for, so scripts/core-update-pin.mjs below is main's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "${{ github.sha }}" }
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-bump
          path: ${{ runner.temp }}/bump
      # No package-manager cache: the bump job ran upstream code that could have written one.
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, package-manager-cache: false }
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe
        name: npm, hash-checked (the same npm as the bump job)
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/npm-pinned"
          rm -rf "$dir"; mkdir -p "$dir"
          curl -sSfL --proto '=https' -o "$dir/npm.tgz" "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
          printf '%s  %s\n' "$NPM_SHA256" "$dir/npm.tgz" | sha256sum -c --quiet -
          tar -xzf "$dir/npm.tgz" -C "$dir"
          test "$(node "${RUNNER_TEMP}/npm-pinned/package/bin/npm-cli.js" --version)" = "$NPM_VERSION"
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe
        id: apply
        name: Regenerate the bump here and refuse an artifact that differs
        env: { LATEST: "${{ needs.bump.outputs.latest }}", CURRENT: "${{ needs.bump.outputs.current }}" }
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/bump"
          refuse() { echo "::error::$1"; git reset -q --hard HEAD; git clean -fdq; exit 1; }
          [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || refuse "the upstream tag is not vMAJOR.MINOR.PATCH"
          [[ "$CURRENT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || refuse "the pinned tag is not vMAJOR.MINOR.PATCH"
          [ -d "$dir/files" ] && [ -f "$dir/outcome.txt" ] || refuse "the artifact is incomplete"
          [ -z "$(find "$dir" ! -type f ! -type d -print -quit)" ] || refuse "the artifact holds a link or a special file"
          [ "$(cd "$dir" && find . -mindepth 1 | LC_ALL=C sort | tr '\n' ' ')" = "./files ./files/package-lock.json ./files/package.json ./outcome.txt " ] \
            || refuse "the artifact holds something besides package.json, package-lock.json and outcome.txt"
          [ "$(stat -c %s "$dir/outcome.txt")" -le 16 ] || refuse "the outcome is too long"
          outcome="$(cat "$dir/outcome.txt")"
          case "$outcome" in success|failure) ;; *) refuse "the outcome is neither success nor failure" ;; esac
          # Regenerate with this checkout's own code: the pin script and a lock-only install that loads no package's
          # code and runs no script (see the header). check-lock refuses a lock that strays from the two release URLs
          # and the npm registry.
          node scripts/core-update-pin.mjs bump --from "$CURRENT" --to "$LATEST" || refuse "the bump does not apply to main"
          node "${RUNNER_TEMP}/npm-pinned/package/bin/npm-cli.js" install --package-lock-only --ignore-scripts --allow-git=none --allow-remote=root --allow-file=none --allow-directory=root --no-audit --no-fund --no-update-notifier || refuse "npm could not re-lock"
          node scripts/core-update-pin.mjs check-lock --tag "$LATEST" || refuse "the regenerated lock breaks the pin policy"
          for path in package.json package-lock.json; do
            cmp -s -- "$path" "$dir/files/$path" || refuse "${path} in the artifact differs from the one regenerated here"
          done
          [ "$(git status --porcelain | LC_ALL=C sort | tr '\n' ' ')" = " M package-lock.json  M package.json " ] \
            || refuse "the regeneration changed something besides package.json and package-lock.json"
          git --no-pager diff --stat
          # Untrusted (job 1 ran upstream code): used for the label and the title only.
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
      - id: app-token
        name: GitHub App token (this repository only; Contents and Pull requests write)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HCW_MAIN_ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.HCW_MAIN_ADMIN_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - if: inputs.probe
        name: Probe - read-only calls as the GitHub App (manual run with probe=true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Minted an installation token for the GitHub App ${APP_SLUG}."
          gh api "repos/${REPO}" --jq '"Read-only call as the App succeeded for " + .full_name'
          covered="$(gh api installation/repositories --jq '[.repositories[].full_name] | join(",")')"
          echo "The token covers these repositories: ${covered}"
          test "${covered}" = "${REPO}" || { echo "::error::The token must cover ${REPO} and nothing else"; exit 1; }
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe
        id: pr
        name: Open the bump pull request (ready for review)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The checkout is a commit (github.sha), not a branch, so the action is told the base.
          base: main
          branch: core-update/${{ needs.bump.outputs.latest }}
          title: "core: adopt upstream ${{ needs.bump.outputs.latest }} (${{ steps.apply.outputs.outcome == 'success' && 'compatible' || 'needs adaptation' }})"
          commit-message: "core: adopt the upstream release tarballs ${{ needs.bump.outputs.current }} -> ${{ needs.bump.outputs.latest }}"
          labels: core-update,${{ steps.apply.outputs.outcome == 'success' && 'compatible' || 'needs-adaptation' }}
          add-paths: |
            package.json
            package-lock.json
          body: |
            Upstream `saulpatinojr/HCW-MigrateOrchestrator_App` released **${{ needs.bump.outputs.latest }}** (this edition pinned `${{ needs.bump.outputs.current }}`). The two package tarballs attached to that release are pinned by URL; the lock carries their integrity hash.

            Compatibility check in this workflow run (`npm ci` → `npm test` → build → Playwright e2e): **${{ steps.apply.outputs.outcome }}**.
            The compatibility check ran in the run's `bump` job, which holds no secret. This pull request was opened by its `pull-request` job, which ran no package code: it regenerated `package.json` and `package-lock.json` itself (a lock-only install with scripts, git and other URLs refused) and checked they are byte-identical to the `bump` job's.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - compatible: merge.
            - needs adaptation: fix this edition on this branch, then merge.

            When the repository variable `CORE_AUTOMERGE` is `true`, auto-merge is turned on for every bump, compatible or not, and GitHub merges only after this pull request's required checks pass. The label above comes from the `bump` job's report, which is not trusted, so it never decides the merge. To hold a bump, select **Disable auto-merge** at the bottom of this page.

            ADR-0028 (downstream flow), ADR-0030 (release assets replace the sibling checkout).
      # Never reads the outcome (untrusted, see the header). GitHub merges only once the ruleset's required checks pass
      # on the pull request's own head: https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/automatically-merging-a-pull-request
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe && vars.CORE_AUTOMERGE == 'true' && steps.apply.outcome == 'success' && steps.pr.outputs.pull-request-number != ''
        name: Turn on auto-merge (GitHub merges after the required checks pass on the pull request)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        # The pull request is open and its checks run whatever happens here, so a refusal (for example the
        # repository setting "Allow auto-merge" being off) is a warning to merge by hand, not a failed run.
        run: |
          if ! gh pr merge --squash --auto "$PR_NUMBER"; then
            echo "::warning::Auto-merge was not turned on for pull request #${PR_NUMBER}; merge it by hand."
            echo "Auto-merge needs the repository setting Allow auto-merge to be on."
          fi
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe && steps.apply.outputs.outcome != 'success'
        env: { LATEST: "${{ needs.bump.outputs.latest }}" }
        run: echo "::warning::Upstream ${LATEST} is not compatible with this edition; see the pull request."
