# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Downstream flow (ADR-0028, ADR-0030): the upstream product (saulpatinojr/HCW-MigrateOrchestrator_App) attaches the two
# package tarballs to the GitHub Release of every v* tag. package.json pins them by URL
#   https://github.com/saulpatinojr/HCW-MigrateOrchestrator_App/releases/download/<tag>/hybridcloudworks-migration-core-<version>.tgz
#   https://github.com/saulpatinojr/HCW-MigrateOrchestrator_App/releases/download/<tag>/hybridcloudworks-migration-ui-<version>.tgz
# and package-lock.json carries their integrity hash, which `npm ci` verifies. When a newer release exists, this workflow
# bumps both URLs, re-locks, tests this edition against it (unit tests and the browser e2e suite) and opens a pull request
# labelled compatible or needs-adaptation. A compatible PR auto-merges only if the repository variable CORE_AUTOMERGE is "true".
# The same release-asset method serves the Cloud Assessor and NetworkEyes pairs (a release wheel pinned by URL and sha256).
#
# The pull request is opened with a short-lived GitHub App token (actions/create-github-app-token), not with
# GITHUB_TOKEN. A pull request opened with GITHUB_TOKEN starts no workflow, so the required checks of the
# "Protect main" ruleset never ran on it and it could never merge. One opened with the App token does start
# them, so this edition's own CI (ci, security) also runs on the bump pull request; the compatibility check
# below still runs first, in this run, and decides the compatible / needs-adaptation label and whether
# auto-merge is asked for.
# The credential is the HCW Main Admin App (a GitHub App owned by the repository owner, installed on this
# repository). Its client ID is the repository variable HCW_MAIN_ADMIN_CLIENT_ID (not a secret) and its private
# key is the repository secret HCW_MAIN_ADMIN_PRIVATE_KEY. The key lives only as that secret and is never printed.
# To rotate it: generate a new key on the App's settings page (https://github.com/settings/apps), replace the
# secret in every repository that holds the key (the App is installed on the four add-on
# repositories), then delete the old key there. Only the token step is given the key. That step comes late (after the
# install and the tests have run), mints a token for this repository only with Contents and Pull requests
# write, and the action revokes the token when the job ends.
# GITHUB_TOKEN is read-only here.
# A manual run with probe=true mints the token and makes two read-only API calls (the repository, and the list of
# repositories the token covers, which must be this one only) and nothing else that writes,
# to prove the credential on a day when there is no release to adopt:
#   gh workflow run core-update.yml --ref main -f probe=true
name: core-update
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream release tag to adopt (default: latest release)"
        required: false
      probe:
        description: "Only prove the GitHub App credential: mint the token and make read-only calls (default: false)"
        type: boolean
        default: false
permissions: {}
env:
  UPSTREAM: saulpatinojr/HCW-MigrateOrchestrator_App
jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN may only read here (checkout, and the public releases API of the upstream repository).
    # Everything that writes uses the App token.
    permissions:
      contents: read
    steps:
      # persist-credentials: false — create-pull-request sets its own Authorization header for the push; with the
      # checkout's persisted header beside it, git sends two and GitHub answers 400 (seen in the upstream App's rules-refresh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: refs
        name: Compare the pinned release tag with the latest upstream release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REQUESTED: "${{ inputs.ref }}" }
        run: |
          set -euo pipefail
          current="$(grep -oE "releases/download/v[0-9][0-9A-Za-z.+-]*/hybridcloudworks-migration-core-" package.json | head -1 | sed -E 's|releases/download/||; s|/hybridcloudworks-migration-core-||')"
          test -n "$current" || { echo "::error::package.json does not pin the upstream release tarballs"; exit 1; }
          latest="${REQUESTED:-$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)}"
          case "$latest" in *$'\n'*|*$'\r'*) echo "::error::the upstream tag is not a single line"; exit 1;; esac
          # The tag is pasted into sed and into GITHUB_OUTPUT below, so refuse anything that is not a plain release tag
          # (vMAJOR.MINOR.PATCH, optionally -pre or +build): a tag such as `v9|;e…` would otherwise run a shell command
          # through sed's `e`, in the job that later holds the App token.
          [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "::error::unexpected upstream tag: not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "latest=$latest" >> "$GITHUB_OUTPUT"; echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "already at $current"; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "$current -> $latest"; fi
      - if: steps.refs.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - if: steps.refs.outputs.changed == 'true'
        name: Bump both tarball URLs and re-lock (the lock records each tarball's integrity hash)
        env: { LATEST: "${{ steps.refs.outputs.latest }}", CURRENT: "${{ steps.refs.outputs.current }}" }
        run: |
          set -euo pipefail
          cur_ver="${CURRENT#v}"; new_ver="${LATEST#v}"
          sed -i "s|releases/download/${CURRENT}/hybridcloudworks-migration-core-${cur_ver}.tgz|releases/download/${LATEST}/hybridcloudworks-migration-core-${new_ver}.tgz|; s|releases/download/${CURRENT}/hybridcloudworks-migration-ui-${cur_ver}.tgz|releases/download/${LATEST}/hybridcloudworks-migration-ui-${new_ver}.tgz|" package.json
          grep -q "releases/download/${LATEST}/hybridcloudworks-migration-core-${new_ver}.tgz" package.json
          grep -q "releases/download/${LATEST}/hybridcloudworks-migration-ui-${new_ver}.tgz" package.json
          npm install --package-lock-only --no-audit --no-fund
          git --no-pager diff --stat
      - if: steps.refs.outputs.changed == 'true'
        id: compat
        name: Compatibility check — install, unit tests, browser e2e
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npx playwright install --with-deps chromium
          CI=1 npx playwright test
      - if: steps.refs.outputs.changed == 'true' || inputs.probe
        id: app-token
        name: GitHub App token (this repository only; Contents and Pull requests write)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HCW_MAIN_ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.HCW_MAIN_ADMIN_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - if: inputs.probe
        name: Probe - read-only calls as the GitHub App (manual run with probe=true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Minted an installation token for the GitHub App ${APP_SLUG}."
          gh api "repos/${REPO}" --jq '"Read-only call as the App succeeded for " + .full_name'
          covered="$(gh api installation/repositories --jq '[.repositories[].full_name] | join(",")')"
          echo "The token covers these repositories: ${covered}"
          test "${covered}" = "${REPO}" || { echo "::error::The token must cover ${REPO} and nothing else"; exit 1; }
      - if: steps.refs.outputs.changed == 'true' && !inputs.probe
        id: pr
        name: Open the bump pull request (ready for review)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: core-update/${{ steps.refs.outputs.latest }}
          title: "core: adopt upstream ${{ steps.refs.outputs.latest }} (${{ steps.compat.outcome == 'success' && 'compatible' || 'needs adaptation' }})"
          commit-message: "core: adopt the upstream release tarballs ${{ steps.refs.outputs.current }} -> ${{ steps.refs.outputs.latest }}"
          labels: core-update,${{ steps.compat.outcome == 'success' && 'compatible' || 'needs-adaptation' }}
          add-paths: |
            package.json
            package-lock.json
          body: |
            Upstream `saulpatinojr/HCW-MigrateOrchestrator_App` released **${{ steps.refs.outputs.latest }}** (this edition pinned `${{ steps.refs.outputs.current }}`). The two package tarballs attached to that release are pinned by URL; the lock carries their integrity hash.

            Compatibility check in this workflow run (`npm ci` → `npm test` → build → Playwright e2e): **${{ steps.compat.outcome }}**.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - compatible: merge (automatic if the repository variable `CORE_AUTOMERGE` is `true`).
            - needs adaptation: fix this edition on this branch, then merge.

            ADR-0028 (downstream flow), ADR-0030 (release assets replace the sibling checkout).
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome == 'success' && vars.CORE_AUTOMERGE == 'true' && steps.pr.outputs.pull-request-number != '' && !inputs.probe
        name: Auto-merge the compatible bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        # The pull request is open and its checks run whatever happens here, so a refusal (for example the
        # repository setting "Allow auto-merge" being off) is a warning to merge by hand, not a failed run.
        run: |
          if ! gh pr merge --squash --auto "$PR_NUMBER"; then
            echo "::warning::Auto-merge was not turned on for pull request #${PR_NUMBER}; merge it by hand."
            echo "Auto-merge needs the repository setting Allow auto-merge to be on."
          fi
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome != 'success'
        env: { LATEST: "${{ steps.refs.outputs.latest }}" }
        run: echo "::warning::Upstream ${LATEST} is not compatible with this edition; see the pull request."
