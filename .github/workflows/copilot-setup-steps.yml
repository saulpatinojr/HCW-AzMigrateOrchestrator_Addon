# Lets the GitHub Copilot coding agent build and test this repository in its ephemeral environment.
name: Copilot Setup Steps
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/copilot-setup-steps.yml"]
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
