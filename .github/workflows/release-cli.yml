# PIN-BY-SHA: see VALIDATION.md.
# Builds the single-executable `amo` CLI (Node SEA) for Linux, macOS and Windows on tags and attaches them to the release.
name: release-cli
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  sea:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: bash scripts/build-sea.sh
        shell: bash
      - name: Smoke test
        run: ./dist-sea/amo* rules validate
        shell: bash
      - uses: actions/attest-build-provenance@v2.2.3
        with: { subject-path: dist-sea/amo* }
      - uses: actions/upload-artifact@v4.6.2
        with: { name: amo-${{ matrix.os }}, path: dist-sea/amo* }
      - uses: softprops/action-gh-release@v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: dist-sea/amo* }
