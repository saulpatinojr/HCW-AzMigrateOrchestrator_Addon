# PIN-BY-SHA: actions pinned by version tag in this build; convert to commit SHAs (pinact/dependabot) before relying on this as a release gate — VALIDATION.md.
name: publish-images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: lab, dockerfile: infrastructure/docker/Dockerfile.lab }
          - { name: lab-workspace, dockerfile: infrastructure/coder/image/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/azure-migration-orchestrator-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3.4.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2.2.3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@0.29.0
        with: { image-ref: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true }
