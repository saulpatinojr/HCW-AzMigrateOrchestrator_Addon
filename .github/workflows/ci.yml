# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# The published packages come from saulpatinojr/HCW-AzMigrateOrchestrator_App at APP_REF (a release tag, never main) until they
# are on npm (ADR-0028 interim contract). core-update.yml bumps APP_REF when a new upstream release passes these same checks.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
env:
  APP_REF: v0.2.1
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: HCW-AzMigrateOrchestrator_Addon } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: HCW-AzMigrateOrchestrator_Addon }
      - name: Check out the upstream product at the pinned release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: saulpatinojr/HCW-AzMigrateOrchestrator_App, ref: "${{ env.APP_REF }}", path: HCW-AzMigrateOrchestrator_App }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 26, cache: npm, cache-dependency-path: "HCW-AzMigrateOrchestrator_*/package-lock.json" }
      - name: Build upstream and assemble its packages
        run: npm ci && npm run build
        working-directory: HCW-AzMigrateOrchestrator_App
      - run: npm ci
      - name: Build the API and the pane (apps/lab-web/dist)
        run: npm run build
      - run: npm test
      - name: Package repository ZIP (artifact)
        run: bash scripts/package-repository.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: hcw-azmigrateorchestrator-addon, path: HCW-AzMigrateOrchestrator_Addon/hcw-azmigrateorchestrator-addon.zip, retention-days: 7 }

  e2e:
    # Browser e2e of the pane: the published UI package built into apps/lab-web, served by the real lab API, framed by a host
    # page with the site's sandbox, with the human-verification widget stubbed and siteverify mocked (playwright.config.ts).
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: HCW-AzMigrateOrchestrator_Addon } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: HCW-AzMigrateOrchestrator_Addon }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: saulpatinojr/HCW-AzMigrateOrchestrator_App, ref: "${{ env.APP_REF }}", path: HCW-AzMigrateOrchestrator_App }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 26, cache: npm, cache-dependency-path: "HCW-AzMigrateOrchestrator_*/package-lock.json" }
      - run: npm ci && npm run build
        working-directory: HCW-AzMigrateOrchestrator_App
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { CI: "1" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: playwright-traces, path: HCW-AzMigrateOrchestrator_Addon/test-results/, retention-days: 7 }
