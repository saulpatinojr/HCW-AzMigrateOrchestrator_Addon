# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# The two upstream packages are the tarballs attached to the GitHub Release of the pinned v* tag of
# saulpatinojr/HCW-AzMigrateOrchestrator_App (package.json pins them by URL; package-lock.json carries their integrity hash).
# core-update.yml bumps the tag when a new upstream release passes these same checks. No upstream checkout is needed.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - name: Build the API and the pane (apps/lab-web/dist)
        run: npm run build
      - run: npm test
      - name: Package repository ZIP (artifact)
        run: bash scripts/package-repository.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: hcw-azmigrateorchestrator-addon, path: hcw-azmigrateorchestrator-addon.zip, retention-days: 7 }

  e2e:
    # Browser e2e of the pane: the published UI package built into apps/lab-web, served by the real lab API, framed by a host
    # page with the site's sandbox, with the human-verification widget stubbed and siteverify mocked (playwright.config.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm }
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { CI: "1" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: playwright-traces, path: test-results/, retention-days: 7 }
