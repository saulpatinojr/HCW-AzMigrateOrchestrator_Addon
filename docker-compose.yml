# Local development: demo edition only. `docker compose up --build`
services:
  lab-api:
    build: { context: .., dockerfile: HCW-AzMigrateOrchestrator_Addon/infrastructure/docker/Dockerfile.lab } # parent directory holds both checkouts (ADR-0028)
    ports: ["8080:8080"]
    environment:
      AMO_ASSESSMENT_TTL_MINUTES: "120"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
    restart: unless-stopped
